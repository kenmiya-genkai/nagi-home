<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f0e7">
  <title>なぎのおうち｜V2.2.1</title>
  <link rel="stylesheet" href="style.css">
  <script src="content.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="home">
    <header class="topbar">
      <div><h1>なぎのおうち <span class="beta">V2.2.1</span></h1><p id="band-label">あさのなぎ</p><p id="greeting"></p></div>
      <div class="status"><time id="time"></time><span id="weather-chip" class="chip" hidden></span><span id="sunset-chip" class="chip" hidden></span><span id="moon-chip" class="chip" hidden></span></div>
    </header>
    <section id="scene" class="scene" aria-label="なぎのおうちの様子">
      <img id="background" class="background" src="assets/bg-day.webp" alt="">
      <div id="weather-fx" class="fx-layer"></div><div id="window-event" class="window-event"></div>
      <div id="stars" aria-hidden="true"></div><div id="ferry" aria-hidden="true"></div><div id="creature" aria-hidden="true"></div>
      <img id="cat" class="cat" alt="">
      <div id="rare-star" class="rare-star" aria-hidden="true"></div>
      <div id="boat-light" class="boat-light" aria-hidden="true"></div>
      <img id="nagi" class="nagi" alt="">
      <img id="blink-img" class="nagi" alt="">
      <div id="lamp-glow" hidden></div><div id="sunset-glow" hidden></div><div id="moonlight" hidden></div><div id="lightning" hidden></div><div id="fireflies" hidden></div>
      <div id="cal-chip"></div><div id="wall-clock"><i class="hour-hand"></i><i class="minute-hand"></i><i class="second-hand"></i></div><div id="books-done"></div>
      <img id="furin-img" src="assets/prop-furin.webp" alt="" hidden><img id="flower-img" alt="" hidden><img id="frame-photo" alt="" hidden><div id="wall-note" hidden></div>
      <img id="laundry-img" class="decoration laundry" alt="">
      <img id="plant-img" class="decoration plant" alt="">
      <img id="umbrella" class="decoration umbrella" alt="">
      <img id="himono" class="decoration himono" alt="">
      <figure id="island-photo" hidden><img id="island-photo-img" alt=""><figcaption id="island-photo-caption"></figcaption></figure>
      <span id="season" class="season" aria-hidden="true"></span>
      <p id="night-book" class="night-book" hidden></p>
      <p id="dream-note" class="night-book dream-note" hidden></p>
      <p id="preview-note" class="night-book preview-note" hidden></p>
      <p id="event-note" class="event-note" hidden></p>
      <p id="away-note" class="away-note" hidden></p>
    </section>
    <section id="dance-video-card" class="dance-video-card" aria-label="なぎのダンス" hidden>
      <video id="dance-video" playsinline loop preload="none" aria-label="なぎのダンス動画"></video>
      <button id="dance-return-button" type="button">お部屋に戻る</button>
    </section>
    <section id="verse-card" class="verse-card"><small>今日の一句</small><p></p></section>
    <p id="line" class="line" aria-live="polite"></p>
    <p id="reply-bubble" class="reply" aria-live="polite" hidden></p>
    <nav class="actions" aria-label="できること">
      <button id="call-button" type="button">なぎに声をかける</button>
      <button id="letter-button" type="button" hidden>ポスト <span id="letter-badge" class="badge">手紙</span></button>
      <button id="diary-button" type="button">日記帳</button>
      <button id="zoom-btn" type="button">🔍 のぞく</button>
      <button id="photo-button" type="button">📷 写真モード</button>
      <button id="guestbook-button" type="button">📖 ゲストブック</button>
      <button id="dance-button" type="button" hidden>ダンスを見る♪</button>
    </nav>
    <section class="collection"><div class="section-heading"><h2>コレクション棚</h2><span id="collection-count">0件</span></div><div id="collection-items" class="collection-items"></div></section>
    <footer><span id="visit-record"></span></footer>
  </main>
  <div id="diary-overlay" class="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="diary-title"><button id="diary-close" class="close" type="button" aria-label="閉じる">×</button><h2 id="diary-title">なぎの日記</h2><time id="diary-date"></time><p id="diary-content"></p></section></div>
  <div id="letter-overlay" class="overlay" hidden><section class="modal letter-modal" role="dialog" aria-modal="true" aria-labelledby="letter-title"><button id="letter-close" class="close" type="button" aria-label="閉じる">×</button><h2 id="letter-title">なぎからの手紙</h2><p id="letter-content"></p></section></div>
  <div id="guestbook-overlay" class="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="guestbook-title"><button id="guestbook-close" class="close" type="button" aria-label="閉じる">×</button><h2 id="guestbook-title">ゲストブック</h2><textarea id="guestbook-text" maxlength="500" rows="4" aria-label="書き込み"></textarea><button id="guestbook-save" type="button">保存</button><div id="guestbook-entries"></div></section></div>
  <button id="photo-exit" type="button" hidden>戻る</button><button id="wallpaper-btn" type="button" hidden>壁紙にする</button>
</body>
</html>
